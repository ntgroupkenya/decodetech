# Publishes a preview of the shop to GitHub Pages: https://ntgroupkenya.github.io/decodetech/
# It runs on every push to main. GitHub Pages has no PHP or database, so the preview uses the sample
# products in docs/ (see scripts/pages-demo.mjs). The real site is deployed with `npm run package`.
name: GitHub Pages preview

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build:pages
        env:
          # The preview lives at https://<owner>.github.io/<repo>/, so every link and file path starts with /<repo>/.
          VITE_BASE: /${{ github.event.repository.name }}/
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
